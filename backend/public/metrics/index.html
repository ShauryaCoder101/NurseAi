<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NurseAI – Metrics Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0a0f1a;
      --bg-secondary: #111827;
      --bg-card: #1a2235;
      --border: #1e293b;
      --text-primary: #e2e8f0;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --accent: #14b8a6;
      --accent-glow: rgba(20, 184, 166, 0.1);
      --accent-border: rgba(20, 184, 166, 0.3);
      --green: #22c55e;
      --red: #ef4444;
      --amber: #f59e0b;
      --blue: #3b82f6;
      --purple: #a855f7;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
    }

    /* Header */
    .header {
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      padding: 20px 32px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .header h1 {
      font-size: 22px;
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent), var(--blue));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .header .subtitle { color: var(--text-muted); font-size: 13px; }

    /* Container */
    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 24px;
    }

    /* Section title */
    .section-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .section-title .icon { font-size: 20px; }

    /* Stats grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 16px;
      margin-bottom: 40px;
    }
    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      transition: all 0.2s;
    }
    .stat-card:hover { border-color: var(--accent-border); transform: translateY(-2px); }
    .stat-value {
      font-size: 28px;
      font-weight: 800;
      color: var(--accent);
      margin-bottom: 6px;
    }
    .stat-label {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Doctor cards */
    .doctor-cards { display: flex; flex-direction: column; gap: 20px; }
    .doctor-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
    }
    .doctor-header {
      padding: 18px 22px;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .doctor-email {
      font-weight: 700;
      font-size: 15px;
      color: var(--accent);
    }
    .doctor-badge {
      background: var(--accent-glow);
      border: 1px solid var(--accent-border);
      color: var(--accent);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }
    .eval-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      padding: 18px 22px;
    }
    .eval-stat {
      text-align: center;
      padding: 12px;
      border-radius: 8px;
      background: var(--bg-primary);
      border: 1px solid var(--border);
    }
    .eval-stat-value {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 4px;
    }
    .eval-stat-label {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 500;
      text-transform: uppercase;
    }
    .eval-stat-value.positive { color: var(--green); }
    .eval-stat-value.negative { color: var(--red); }
    .eval-stat-value.neutral { color: var(--blue); }

    /* Dropdowns */
    .negative-section {
      padding: 0 22px 18px;
    }
    .dropdown-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(239, 68, 68, 0.06);
      border: 1px solid rgba(239, 68, 68, 0.15);
      border-radius: 8px;
      padding: 10px 16px;
      cursor: pointer;
      color: var(--red);
      font-weight: 600;
      font-size: 13px;
      margin-bottom: 6px;
      transition: background 0.2s;
    }
    .dropdown-toggle:hover { background: rgba(239, 68, 68, 0.1); }
    .dropdown-toggle .arrow { transition: transform 0.2s; }
    .dropdown-toggle.open .arrow { transform: rotate(180deg); }
    .dropdown-content {
      display: none;
      padding: 8px 0;
    }
    .dropdown-content.show { display: block; }
    .neg-item {
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }
    .neg-item:last-child { border-bottom: none; }
    .neg-patient {
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 3px;
    }
    .neg-comment {
      color: var(--text-secondary);
      font-style: italic;
    }

    .loading {
      text-align: center;
      padding: 60px 0;
      color: var(--text-muted);
      font-size: 15px;
    }
    .spinner-lg {
      display: inline-block;
      width: 28px; height: 28px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .no-data { color: var(--text-muted); font-style: italic; text-align: center; padding: 20px; }

    /* Case Evaluation Table */
    .case-table-wrap {
      overflow-x: auto;
      border-radius: 12px;
      border: 1px solid var(--border);
    }
    .case-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      min-width: 900px;
    }
    .case-table thead {
      background: var(--bg-secondary);
      position: sticky;
      top: 0;
      z-index: 2;
    }
    .case-table th {
      padding: 12px 14px;
      text-align: center;
      font-weight: 700;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-secondary);
      border-bottom: 2px solid var(--border);
      white-space: nowrap;
    }
    .case-table th:first-child,
    .case-table th:nth-child(2) { text-align: left; }
    .case-table td {
      padding: 10px 14px;
      text-align: center;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }
    .case-table td:first-child,
    .case-table td:nth-child(2) { text-align: left; font-weight: 500; }
    .case-table tbody tr { background: var(--bg-card); }
    .case-table tbody tr:hover { background: #1e2d42; }
    .case-table tbody tr:nth-child(even) { background: #151d2e; }
    .case-table tbody tr:nth-child(even):hover { background: #1e2d42; }
    .tick { color: var(--green); font-weight: 700; font-size: 16px; }
    .cross { color: var(--red); font-weight: 700; font-size: 16px; }
    .dash { color: var(--text-muted); }
    .comment-cell {
      text-align: left !important;
      font-size: 11px;
      color: var(--text-secondary);
      line-height: 1.6;
      max-width: 220px;
    }
    .comment-cell .c-label {
      color: var(--text-muted);
      font-weight: 600;
      font-size: 10px;
      text-transform: uppercase;
    }
    /* Score colors */
    .score-high { color: var(--green); font-weight: 700; }
    .score-mid { color: var(--amber); font-weight: 600; }
    .score-low { color: var(--red); font-weight: 700; }
    .score-na { color: var(--text-muted); font-style: italic; font-size: 11px; }
    .case-table .summary-row td {
      background: var(--bg-secondary) !important;
      font-weight: 700;
      border-top: 2px solid var(--accent-border);
      font-size: 13px;
    }
    .case-table .range-row td {
      background: var(--bg-secondary) !important;
      font-size: 11px;
      color: var(--text-secondary);
    }
    .ensemble-header { text-align: center; }
  </style>
</head>
<body>

<div class="header">
  <div>
    <h1>📊 NurseAI Metrics</h1>
    <div class="subtitle">Public dashboard · Real-time stats</div>
  </div>
</div>

<div class="container">
  <!-- App Stats -->
  <div class="section-title"><span class="icon">📈</span> App Usage Statistics</div>
  <div class="stats-grid" id="statsGrid">
    <div class="loading"><div class="spinner-lg"></div><br>Loading stats...</div>
  </div>

  <!-- Benchmarking -->
  <div class="section-title"><span class="icon">🧪</span> Benchmarking Evaluations</div>
  <div class="doctor-cards" id="doctorCards">
    <div class="loading"><div class="spinner-lg"></div><br>Loading benchmarking data...</div>
  </div>

  <!-- Case-Level Table -->
  <div style="margin-top:40px;">
    <div class="section-title"><span class="icon">📋</span> Case-Level Doctor Evaluations</div>
    <div id="caseTableContainer">
      <div class="loading"><div class="spinner-lg"></div><br>Loading case evaluations...</div>
    </div>
  </div>

  <!-- LLM-as-a-Judge Results -->
  <div style="margin-top:40px;">
    <div class="section-title"><span class="icon">🤖</span> LLM-as-a-Judge Benchmark Results</div>
    <div id="llmTableContainer">
      <div class="loading"><div class="spinner-lg"></div><br>Loading LLM results...</div>
    </div>
  </div>
</div>

<script>
async function loadMetrics() {
  try {
    const res = await fetch('/api/metrics');
    const data = await res.json();
    if (!data.success) throw new Error(data.error);

    renderAppStats(data.data.app);
    renderBenchmarking(data.data.benchmarking);
    renderCaseTable(data.data.caseEvaluations || []);
    renderLlmTable(data.data.llmResults || []);
  } catch (err) {
    console.error('Metrics load error:', err);
    document.getElementById('statsGrid').innerHTML = '<div class="no-data">Failed to load metrics.</div>';
    document.getElementById('doctorCards').innerHTML = '<div class="no-data">Failed to load benchmarking data.</div>';
    document.getElementById('caseTableContainer').innerHTML = '<div class="no-data">Failed to load case data.</div>';
  }
}

function renderAppStats(app) {
  const stats = [
    { value: app.totalUsers, label: 'Total Users', color: 'var(--blue)' },
    { value: app.avgUsePerUser, label: 'Avg Use / User', color: 'var(--purple)' },
    { value: app.totalUses, label: 'Total Audio Sent', color: 'var(--accent)' },
    { value: app.totalFlagged, label: 'Flagged Suggestions', color: 'var(--red)' },
    { value: app.followupQuestions, label: 'Follow-up Questions', color: 'var(--amber)' },
    { value: `~${app.totalAudioMinutes} min`, label: 'Audio Processed', color: 'var(--green)' },
  ];

  document.getElementById('statsGrid').innerHTML = stats.map(s => `
    <div class="stat-card">
      <div class="stat-value" style="color:${s.color}">${s.value}</div>
      <div class="stat-label">${s.label}</div>
    </div>
  `).join('');
}

function renderBenchmarking(benchmarking) {
  if (benchmarking.length === 0) {
    document.getElementById('doctorCards').innerHTML = '<div class="no-data">No doctors have completed evaluations yet.</div>';
    return;
  }

  document.getElementById('doctorCards').innerHTML = benchmarking.map((doc, i) => {
    const invalidItems = doc.negativeDetails.filter(d => d.criterion === 'valid');
    const inappropriateItems = doc.negativeDetails.filter(d => d.criterion === 'appropriate');
    const harmfulItems = doc.negativeDetails.filter(d => d.criterion === 'safe_severe');

    return `
      <div class="doctor-card">
        <div class="doctor-header">
          <div class="doctor-email">👨‍⚕️ ${escapeHtml(doc.doctorEmail)}</div>
          <div class="doctor-badge">${doc.casesEvaluated} cases evaluated</div>
        </div>
        <div class="eval-grid">
          <div class="eval-stat"><div class="eval-stat-value neutral">${doc.casesEvaluated}</div><div class="eval-stat-label">Evaluated</div></div>
          <div class="eval-stat"><div class="eval-stat-value positive">${doc.valid}</div><div class="eval-stat-label">Valid</div></div>
          <div class="eval-stat"><div class="eval-stat-value positive">${doc.appropriate}</div><div class="eval-stat-label">Appropriate</div></div>
          <div class="eval-stat"><div class="eval-stat-value positive">${doc.safe}</div><div class="eval-stat-label">Safe</div></div>
          <div class="eval-stat"><div class="eval-stat-value negative">${doc.invalid}</div><div class="eval-stat-label">Invalid</div></div>
          <div class="eval-stat"><div class="eval-stat-value negative">${doc.inappropriate}</div><div class="eval-stat-label">Inappropriate</div></div>
          <div class="eval-stat"><div class="eval-stat-value negative">${doc.harmful}</div><div class="eval-stat-label">Harmful</div></div>
        </div>
        <div class="negative-section">
          ${renderDropdown(i, 'invalid', 'Invalid Cases', invalidItems)}
          ${renderDropdown(i, 'inappropriate', 'Inappropriate Cases', inappropriateItems)}
          ${renderDropdown(i, 'harmful', 'Harmful Cases', harmfulItems)}
        </div>
      </div>
    `;
  }).join('');
}

function renderDropdown(docIdx, type, label, items) {
  if (items.length === 0) return '';
  const id = `dd-${docIdx}-${type}`;
  return `
    <div class="dropdown-toggle" onclick="toggleDropdown('${id}', this)">
      <span>⚠️ ${label} (${items.length})</span>
      <span class="arrow">▼</span>
    </div>
    <div class="dropdown-content" id="${id}">
      ${items.map(item => `
        <div class="neg-item">
          <div class="neg-patient">Patient: ${escapeHtml(item.patientId || item.patientName || 'Unknown')}</div>
          ${item.comment ? `<div class="neg-comment">"${escapeHtml(item.comment)}"</div>` : '<div class="neg-comment">No comment provided</div>'}
        </div>
      `).join('')}
    </div>
  `;
}

function toggleDropdown(id, btn) {
  const el = document.getElementById(id);
  if (!el) return;
  el.classList.toggle('show');
  btn.classList.toggle('open');
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderCaseTable(cases) {
  const container = document.getElementById('caseTableContainer');
  if (!cases || cases.length === 0) {
    container.innerHTML = '<div class="no-data">No benchmark cases found.</div>';
    return;
  }

  function icon(evalObj, criterion) {
    if (!evalObj || !evalObj[criterion]) return '<span class="dash">—</span>';
    const v = evalObj[criterion].value;
    const positives = { valid: 'Valid', appropriate: 'Appropriate', safe_severe: 'Safe' };
    return v === positives[criterion]
      ? '<span class="tick">✓</span>'
      : '<span class="cross">✗</span>';
  }

  function commentBlock(evalObj) {
    if (!evalObj) return '<span class="dash">—</span>';
    const criteria = [
      { key: 'safe_severe', label: 'safe' },
      { key: 'appropriate', label: 'appropriate' },
      { key: 'valid', label: 'valid' },
    ];
    const parts = criteria.map(c => {
      const comment = evalObj[c.key]?.comment;
      return `<span class="c-label">${c.label}:</span> ${comment ? escapeHtml(comment) : '—'}`;
    });
    return parts.join('<br>');
  }

  const rows = cases.map(c => `
    <tr onclick="window.open('/verify/doctor/benchmarking?caseId=${c.audioId}', '_blank')" style="cursor:pointer;" title="Open case in benchmarking portal">
      <td>${c.caseNumber}</td>
      <td>${escapeHtml(c.fileName)}</td>
      <td>${icon(c.abhitesh, 'valid')} ${icon(c.chetanya, 'valid')}</td>
      <td>${icon(c.abhitesh, 'appropriate')} ${icon(c.chetanya, 'appropriate')}</td>
      <td>${icon(c.abhitesh, 'safe_severe')} ${icon(c.chetanya, 'safe_severe')}</td>
      <td class="comment-cell">${commentBlock(c.abhitesh)}</td>
      <td class="comment-cell">${commentBlock(c.chetanya)}</td>
    </tr>
  `).join('');

  container.innerHTML = `
    <div class="case-table-wrap">
      <table class="case-table">
        <thead>
          <tr>
            <th>#</th>
            <th>Case</th>
            <th>Valid (A / C)</th>
            <th>Appropriate (A / C)</th>
            <th>Safe (A / C)</th>
            <th>Abhitesh Comments</th>
            <th>Chetanya Comments</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  `;
}
function renderLlmTable(results) {
  const container = document.getElementById('llmTableContainer');
  if (!results || results.length === 0) {
    container.innerHTML = '<div class="no-data">No LLM benchmark results yet.</div>';
    return;
  }

  function sc(val, fallback) {
    if (val === null || val === undefined) return `<span class="score-na">${fallback || 'N/A'}</span>`;
    const cls = val >= 80 ? 'score-high' : val >= 50 ? 'score-mid' : 'score-low';
    return `<span class="${cls}">${val}/100</span>`;
  }

  function avg(arr) {
    const valid = arr.filter(v => v !== null && v !== undefined);
    if (valid.length === 0) return null;
    return Math.round(valid.reduce((a, b) => a + b, 0) / valid.length);
  }

  function range(arr) {
    const valid = arr.filter(v => v !== null && v !== undefined);
    if (valid.length === 0) return '—';
    const min = Math.min(...valid);
    const max = Math.max(...valid);
    return `${min}–${max}`;
  }

  // Build rows
  const rows = results.map(r => `
    <tr>
      <td>${r.caseNumber}</td>
      <td>${escapeHtml(r.fileName)}</td>
      <td>${sc(r.fairness)}</td>
      <td>${r.appropriateness !== null ? sc(r.appropriateness) : '<span class="score-na">ChatGPT Error</span>'}</td>
      <td>${sc(r.ensemble?.deepseek)}</td>
      <td>${sc(r.ensemble?.gemini)}</td>
      <td>${sc(r.ensemble?.chatgpt)}</td>
      <td>${sc(r.ensemble?.grok)}</td>
      <td>${sc(r.safety)}</td>
    </tr>
  `).join('');

  // Compute averages
  const cols = {
    fair: results.map(r => r.fairness),
    appr: results.map(r => r.appropriateness),
    ds: results.map(r => r.ensemble?.deepseek),
    gem: results.map(r => r.ensemble?.gemini),
    gpt: results.map(r => r.ensemble?.chatgpt),
    grok: results.map(r => r.ensemble?.grok),
    safe: results.map(r => r.safety),
  };

  const avgRow = `
    <tr class="summary-row">
      <td colspan="2" style="text-align:right;">Average</td>
      <td>${sc(avg(cols.fair))}</td>
      <td>${sc(avg(cols.appr))}</td>
      <td>${sc(avg(cols.ds))}</td>
      <td>${sc(avg(cols.gem))}</td>
      <td>${sc(avg(cols.gpt))}</td>
      <td>${sc(avg(cols.grok))}</td>
      <td>${sc(avg(cols.safe))}</td>
    </tr>
  `;

  const rangeRow = `
    <tr class="range-row">
      <td colspan="2" style="text-align:right;">Range</td>
      <td>${range(cols.fair)}</td>
      <td>${range(cols.appr)}</td>
      <td>${range(cols.ds)}</td>
      <td>${range(cols.gem)}</td>
      <td>${range(cols.gpt)}</td>
      <td>${range(cols.grok)}</td>
      <td>${range(cols.safe)}</td>
    </tr>
  `;

  container.innerHTML = `
    <div class="case-table-wrap">
      <table class="case-table">
        <thead>
          <tr>
            <th rowspan="2">#</th>
            <th rowspan="2">Case</th>
            <th rowspan="2">Fairness</th>
            <th rowspan="2">Appropriate</th>
            <th colspan="4" class="ensemble-header" style="border-bottom:1px solid var(--border);">Ensemble</th>
            <th rowspan="2">Safety</th>
          </tr>
          <tr>
            <th>DeepSeek</th>
            <th>Gemini</th>
            <th>ChatGPT</th>
            <th>Grok</th>
          </tr>
        </thead>
        <tbody>
          ${rows}
          ${avgRow}
          ${rangeRow}
        </tbody>
      </table>
    </div>
  `;
}

loadMetrics();
</script>
</body>
</html>
